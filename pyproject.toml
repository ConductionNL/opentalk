[project]
name = "opentalk-exapp"
version = "0.1.0"
description = "OpenTalk video-conferencing ExApp for Nextcloud"
license = "EUPL-1.2"
# Measured, not guessed: the Dockerfile's final stage is `python:3.11-slim`
# and it copies site-packages into /usr/local/lib/python3.11.
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["ex_app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "C90",  # mccabe complexity
]
ignore = [
    "E501",   # line too long (handled by the formatter)
    "B008",   # function call in argument default — the FastAPI Depends() idiom
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nc_py_api.*", "httpx.*", "fastapi.*"]
ignore_missing_imports = true
