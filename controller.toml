# Minimal OpenTalk controller configuration
# Most settings are overridden by environment variables (OPENTALK_CTRL_*)

[http]
port = 11311
bind_address = "0.0.0.0"

[frontend]
base_url = "http://localhost:8080/apps/app_api/embedded/opentalk/opentalk"

[database]
url = "postgres://nextcloud:!ChangeMe!@openregister-postgres:5432/opentalk"

[redis]
url = "redis://openregister-exapp-redis:6379/"

[oidc]
# Overridden at runtime by OPENTALK_CTRL_OIDC__AUTHORITY env var
# The ExApp uses a local TCP proxy (localhost:8180 → keycloak:8080) so the
# controller and browser agree on the same OIDC issuer URL.
authority = "http://openregister-exapp-keycloak:8080/realms/commonground"

[oidc.frontend]
client_id = "opentalk"

[oidc.controller]
client_id = "opentalk-controller"
client_secret = "opentalk-secret"

[livekit]
public_url = "ws://localhost:7881"
service_url = "http://openregister-exapp-livekit:7880"
api_key = "devkey"
api_secret = "secret"

[minio]
uri = "http://openregister-exapp-minio:9000"
bucket = "opentalk"
access_key = "minioadmin"
secret_key = "minioadmin"
